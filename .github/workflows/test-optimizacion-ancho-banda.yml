name: Test optimizacion de ancho de banda

on:
  push:
    branches:
      - optimizacion-ancho-banda
    paths:
      - 'server.js'
      - 'public/index.html'
      - 'test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-optimizacion-ancho-banda.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'server.js'
      - 'public/index.html'
      - 'test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-optimizacion-ancho-banda.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar suite de pruebas
        run: npm test
