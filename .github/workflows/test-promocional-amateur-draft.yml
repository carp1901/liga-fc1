name: Cargar planteles Promocional Amateur 2026
on:
  push:
    branches:
      - 'planteles/promocional-amateur-2026'
    paths:
      - 'planteles/borradores/promocional-amateur-2026/**'
      - 'test-promocional-amateur-draft.js'
      - 'import-squads.js'
      - '.github/workflows/test-promocional-amateur-draft.yml'
  pull_request:
    paths:
      - 'planteles/borradores/promocional-amateur-2026/**'
      - 'test-promocional-amateur-draft.js'
      - 'import-squads.js'
      - '.github/workflows/test-promocional-amateur-draft.yml'
permissions:
  contents: read
jobs:
  validar-e-integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxis
        run: node --check import-squads.js
      - name: Validar los 17 clubes
        run: node test-promocional-amateur-draft.js
      - name: Validar importación sin publicar
        run: |
          node import-squads.js planteles/borradores/promocional-amateur-2026/tanda1-inicial.csv --dry-run
          node import-squads.js planteles/borradores/promocional-amateur-2026/tanda2-inicial.csv --dry-run
      - name: Integrar los planteles en runtime de la rama
        run: |
          node import-squads.js planteles/borradores/promocional-amateur-2026/tanda1-inicial.csv
          node import-squads.js planteles/borradores/promocional-amateur-2026/tanda2-inicial.csv
      - name: Auditar runtime y proteger las demás divisiones
        run: node test-promocional-amateur-draft.js --runtime
      # Sin commit ni push: los datos del juego se publican solo con tools/regenerar-planteles.js (ver planteles.yml).
