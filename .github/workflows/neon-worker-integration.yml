name: Neon Worker integration (isolated branch)

on:
  workflow_dispatch:
  push:
    branches: [cloudflare-workers-backend]
    paths:
      - 'tests/neon-worker-integration.mjs'
      - 'src/**'
      - 'public/data.js'
      - '.github/workflows/neon-worker-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-workers-backend
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run Worker + Neon integration checks
        env:
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
        run: node tests/neon-worker-integration.mjs
