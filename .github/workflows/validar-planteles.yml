name: Validar y publicar planteles
on:
  push:
    branches: [main]
    paths:
      - 'planteles/*.csv'
      - 'planteles/**/*.csv'
      - 'import-squads.js'
      - 'public/data.js'
      - 'test-squads.js'
      - 'test-player-development.js'
      - 'test-career-development.js'
      - 'test-plantel-calibration.js'
      - '.github/workflows/validar-planteles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxis de los módulos
        run: |
          node --check public/data.js
          node --check public/engine.js
          node --check public/player-development.js
          node --check import-squads.js
      - name: Probar evolución e involución de jugadores
        run: node test-player-development.js
      - name: Probar integración de carrera, guardado y cambio de temporada
        run: node test-career-development.js
      - name: Validar escala de medias y perfiles de roles de los planteles
        run: node test-plantel-calibration.js
      - name: Unificar Primera y Primera Nacional para la importación
        run: |
          mkdir -p /tmp/planteles
          {
            head -n 1 planteles/primera-2026.csv
            tail -n +2 planteles/primera-2026.csv
            for file in planteles/borradores/primera-nacional-2026/bloque{1..6}.csv; do
              tail -n +2 "$file"
            done
          } > /tmp/planteles/planteles-2026.csv
      - name: Validar los 66 clubes antes de publicar
        run: node import-squads.js /tmp/planteles/planteles-2026.csv --dry-run --require-both-divisions
      - name: Generar archivos que consume el juego
        run: node import-squads.js /tmp/planteles/planteles-2026.csv --require-both-divisions
      - name: Auditar Primera y Primera Nacional publicadas
        run: node test-squads.js
      - name: Guardar planteles publicados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/squads.json public/squads.js public/squads-meta.json
          if git diff --cached --quiet; then
            echo "Los archivos publicados ya están actualizados."
          else
            git commit -m "Publicar planteles reales de Primera y Primera Nacional 2026"
            git push origin HEAD:main
          fi
