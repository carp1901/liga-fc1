name: Validar y publicar planteles
on:
  push:
    paths:
      - 'planteles/**'
      - 'import-squads.js'
      - 'public/data.js'
      - 'test-squads.js'
      - 'test-player-development.js'
      - 'test-career-development.js'
      - '.github/workflows/validar-planteles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxis de los módulos
        run: |
          node --check public/data.js
          node --check public/engine.js
          node --check public/player-development.js
          node --check import-squads.js
      - name: Auditar los 30 planteles y atributos que consume el juego
        run: node test-squads.js
      - name: Probar evolución e involución de jugadores
        run: node test-player-development.js
      - name: Validar Primera completa sin modificar archivos
        run: node import-squads.js planteles/primera-2026.csv --dry-run --require-primera-complete
      - name: Generar archivos que consume el juego
        run: node import-squads.js planteles/primera-2026.csv --require-primera-complete
      - name: Guardar planteles publicados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/squads.json public/squads.js public/squads-meta.json
          if git diff --cached --quiet; then
            echo "Los archivos publicados ya están actualizados."
          else
            git commit -m "Actualizar planteles reales de Primera 2026"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
