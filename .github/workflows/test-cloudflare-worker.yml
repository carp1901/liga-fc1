name: Cloudflare Worker foundation

on:
  push:
    branches: [cloudflare-workers-backend]
    paths:
      - 'src/worker.mjs'
      - 'public/engine.js'
      - 'CLOUDFLARE-WORKER-MIGRATION.md'
      - 'tests/cloudflare-worker.test.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/test-cloudflare-worker.yml'
  pull_request:
    branches: [cloudflare-workers-backend]
    paths:
      - 'src/worker.mjs'
      - 'tests/cloudflare-worker.test.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/test-cloudflare-worker.yml'

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:cloudflare
      - run: node --check src/worker.mjs
