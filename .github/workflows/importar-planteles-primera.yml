name: Importar planteles reales - Primera Argentina
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Importar planteles 2026 desde API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SEASON: 2026
        run: node import-primera-api.js
      - name: Guardar planteles
        run: |
          git add public/squads.json public/squads.js public/squads-meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Importar planteles reales Primera Argentina 2026"
            git push
          else
            echo "Los planteles ya estaban actualizados."
          fi
