name: Cargar planteles iniciales Primera C 2026
on:
  pull_request:
    paths:
      - 'planteles/borradores/primera-c-2026/**'
      - 'test-primera-c-draft.js'
      - 'import-squads.js'
      - '.github/workflows/test-primera-c-draft.yml'
permissions:
  contents: read
jobs:
  validar-e-integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxis del importador
        run: node --check import-squads.js
      - name: Validar CSV inicial de los veintiocho clubes
        run: node test-primera-c-draft.js
      - name: Validar importaciones sin publicar
        run: |
          node import-squads.js planteles/borradores/primera-c-2026/tanda1-inicial.csv --dry-run
          node import-squads.js planteles/borradores/primera-c-2026/tanda2-inicial.csv --dry-run
          node import-squads.js planteles/borradores/primera-c-2026/tanda3-inicial.csv --dry-run
          node import-squads.js planteles/borradores/primera-c-2026/tanda4-inicial.csv --dry-run
      - name: Integrar los veintiocho planteles en runtime de la rama
        run: |
          node import-squads.js planteles/borradores/primera-c-2026/tanda1-inicial.csv
          node import-squads.js planteles/borradores/primera-c-2026/tanda2-inicial.csv
          node import-squads.js planteles/borradores/primera-c-2026/tanda3-inicial.csv
          node import-squads.js planteles/borradores/primera-c-2026/tanda4-inicial.csv
      - name: Auditar la integración y proteger las demás divisiones
        run: node test-primera-c-draft.js --runtime
      # Sin commit ni push: los datos del juego se publican solo con tools/regenerar-planteles.js (ver planteles.yml).
