name: Nationality audit
on:
  push:
    branches: [auditoria-nacionalidades-2026]
  pull_request:
    paths:
      - 'planteles/**'
      - 'import-squads.js'
      - 'public/index.html'
      - 'test-nationality-audit.js'
      - '.github/workflows/test-nationality-audit.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check import-squads.js
      - run: node test-nationality-audit.js
