
name: Completar tres escudos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Sharp
        run: npm install --no-save sharp

      - name: Buscar y convertir escudos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const dir = 'public/crests';
          fs.mkdirSync(dir, { recursive: true });

          const equipos = {
            defbelgranovr: [
              'https://ligasargentinas.com.ar/club/defensores-belgrano-fa'
            ],
            escobar: [
              'https://ligasargentinas.com.ar/club/atletico-escobar-fc'
            ],
            vilelas: [
              'https://www.futbol360.com.ar/equipos/argentina/def.-de-vilelas/'
            ]
          };

          const cabeceras = {
            'User-Agent': 'Mozilla/5.0 (compatible; LigaFC/1.0)',
            'Accept': 'text/html,image/avif,image/webp,image/png,image/*,*/*'
          };

          async function obtener(url) {
            const r = await fetch(url, {
              headers: cabeceras,
              signal: AbortSignal.timeout(20000)
            });

            if (!r.ok) throw new Error('HTTP ' + r.status);
            return Buffer.from(await r.arrayBuffer());
          }

          function extraerImagenes(html, pagina) {
            const resultados = [];
            const etiquetas = html.match(/<img\b[^>]*>/gi) || [];

            for (const tag of etiquetas) {
              const alt = (tag.match(/\balt=["']([^"']*)["']/i) || [,''])[1];
              const src =
                (tag.match(/\b(?:src|data-src|data-original)=["']([^"']+)["']/i) || [,''])[1];

              if (!src || src.startsWith('data:')) continue;

              const texto = (alt + ' ' + src).toLowerCase();

              if (
                /escudo|defensores|vilelas|atletico-escobar|atletico_escobar/.test(texto)
              ) {
                try {
                  resultados.push(new URL(src, pagina).href);
                } catch (_) {}
              }
            }

            const og = html.match(
              /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i
            );

            if (og) {
              try {
                resultados.push(new URL(og[1], pagina).href);
              } catch (_) {}
            }

            return [...new Set(resultados)];
          }

          async function main() {
            const faltantes = [];

            for (const [id, paginas] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');

              if (fs.existsSync(destino)) {
                try {
                  const m = await sharp(destino).metadata();
                  if (m.width && m.height) {
                    console.log('YA EXISTE, SE CONSERVA:', destino);
                    continue;
                  }
                } catch (_) {}
              }

              let guardado = false;

              for (const pagina of paginas) {
                try {
                  console.log('REVISANDO FICHA:', pagina);
                  const html = (await obtener(pagina)).toString('utf8');
                  const imagenes = extraerImagenes(html, pagina);

                  console.log('IMAGENES CANDIDATAS:', imagenes.length);

                  for (const url of imagenes) {
                    try {
                      console.log('PROBANDO IMAGEN:', url);
                      const buffer = await obtener(url);

                      if (buffer.length < 300) {
                        throw new Error('Archivo demasiado pequeño');
                      }

                      const meta = await sharp(buffer).metadata();

                      if (!meta.width || !meta.height) {
                        throw new Error('No es una imagen válida');
                      }

                      if (meta.width < 60 || meta.height < 60) {
                        throw new Error('Imagen demasiado pequeña');
                      }

                      const png = await sharp(buffer)
                        .resize(500, 500, {
                          fit: 'contain',
                          background: { r: 255, g: 255, b: 255, alpha: 0 },
                          withoutEnlargement: true
                        })
                        .png()
                        .toBuffer();

                      fs.writeFileSync(destino, png);
                      console.log('GUARDADO:', destino, 'DESDE:', url);
                      guardado = true;
                      break;
                    } catch (e) {
                      console.log('IMAGEN DESCARTADA:', e.message);
                    }
                  }

                  if (guardado) break;
                } catch (e) {
                  console.log('FALLO EN FICHA:', pagina, e.message);
                }
              }

              if (!guardado) {
                faltantes.push(id);
                console.log('NO SE PUDO EXTRAER:', id);
              }
            }

            fs.writeFileSync(
              path.join(dir, 'faltantes-tres-escudos.txt'),
              faltantes.join('\n') + (faltantes.length ? '\n' : '')
            );

            console.log('RESULTADO:', faltantes.length
              ? 'Siguen faltando: ' + faltantes.join(', ')
              : 'Se procesaron los tres escudos');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Completar escudos de Federal A"
            git push
          else
            echo "No hubo archivos nuevos"
          fi
