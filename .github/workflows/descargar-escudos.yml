name: Corregir escudos Promocional Amateur

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escudos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar herramientas
        run: npm install sharp

      - name: Descargar y corregir escudos
        run: |
          mkdir -p public/crests

          cat > descargar.js <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          async function descargar(url) {
            const r = await fetch(url, {
              headers: { 'User-Agent': 'Mozilla/5.0' },
              redirect: 'follow'
            });

            if (!r.ok) throw new Error('HTTP ' + r.status);

            const buffer = Buffer.from(await r.arrayBuffer());
            const meta = await sharp(buffer).metadata();

            if (!meta.width || !meta.height) {
              throw new Error('La respuesta no es una imagen');
            }

            return buffer;
          }

          async function guardar(id, urls, quitarBlanco = false) {
            for (const url of urls) {
              try {
                const original = await descargar(url);

                let salida = await sharp(original)
                  .rotate()
                  .resize(500, 500, {
                    fit: 'contain',
                    background: {
                      r: 0, g: 0, b: 0, alpha: 0
                    }
                  })
                  .ensureAlpha()
                  .png()
                  .toBuffer();

                if (quitarBlanco) {
                  const resultado = await sharp(salida)
                    .raw()
                    .toBuffer({ resolveWithObject: true });

                  const { data, info } = resultado;

                  for (let i = 0; i < data.length; i += info.channels) {
                    if (
                      data[i] >= 248 &&
                      data[i + 1] >= 248 &&
                      data[i + 2] >= 248
                    ) {
                      data[i + 3] = 0;
                    }
                  }

                  salida = await sharp(data, {
                    raw: info
                  }).png().toBuffer();
                }

                fs.writeFileSync(
                  'public/crests/' + id + '.png',
                  salida
                );

                console.log('GUARDADO: ' + id);
                return true;

              } catch (e) {
                console.log('Fuente fallida para ' + id + ': ' + e.message);
              }
            }

            console.log('PENDIENTE: ' + id);
            return false;
          }

          async function main() {
            const mandarinas = await guardar('mandarinas', [
              'https://commons.wikimedia.org/wiki/Special:FilePath/Club%20Deportivo%20y%20Fomento%20Las%20Mandarinas.png'
            ], true);

            const provincial = await guardar('udprovincial', [
              'https://w7.pngwing.com/pngs/747/249/png-transparent-club-union-deportiva-provincial-de-empalme-lobos-hd-logo-thumbnail.png',
              'https://futbolinterior.com.ar/escudos/ppal/ampesc.php?cod=417&idpcia=1'
            ]);

            console.log('RESULTADO:', {
              mandarinas,
              udprovincial: provincial
            });

            if (!mandarinas || !provincial) {
              process.exitCode = 1;
            }
          }

          main().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          NODE

          node descargar.js

      - name: Guardar cambios
        if: success()
        run: |
          git add public/crests/mandarinas.png public/crests/udprovincial.png

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Corregir escudos de Mandarinas y Provincial"
            git push
          else
            echo "No hay cambios para guardar."
          fi
