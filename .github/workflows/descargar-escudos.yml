name: Completar últimos 3 escudos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Sharp
        run: npm install --no-save sharp

      - name: Descargar escudos directos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          const escudos = [
            {
              id: 'barrancas',
              url: 'https://upload.wikimedia.org/wikipedia/commons/7/7e/Barrancas_F%C3%BAtbol_Club.png'
            },
            {
              id: 'mandarinas',
              url: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Club%20Deportivo%20y%20Fomento%20Las%20Mandarinas.png'
            },
            {
              id: 'udprovincial',
              url: 'https://futbolinterior.com.ar/escudos/ppal/ampesc.php?cod=417&idpcia=1'
            }
          ];

          async function main() {
            fs.mkdirSync('public/crests', { recursive: true });
            const fallos = [];

            for (const e of escudos) {
              try {
                console.log('Descargando:', e.id);

                const r = await fetch(e.url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 LigaFC',
                    'Accept': 'image/png,image/webp,image/jpeg,image/*,*/*'
                  },
                  redirect: 'follow',
                  signal: AbortSignal.timeout(30000)
                });

                if (!r.ok) {
                  throw new Error('HTTP ' + r.status);
                }

                const bytes = Buffer.from(await r.arrayBuffer());
                const meta = await sharp(bytes).metadata();

                if (!meta.width || !meta.height ||
                    meta.width < 80 || meta.height < 80) {
                  throw new Error('La URL no devolvió una imagen válida');
                }

                const ratio = meta.width / meta.height;
                if (ratio < 0.5 || ratio > 1.8) {
                  throw new Error('Proporción no válida para un escudo');
                }

                const png = await sharp(bytes)
                  .resize(500, 500, {
                    fit: 'contain',
                    background: {
                      r: 255, g: 255, b: 255, alpha: 0
                    }
                  })
                  .png()
                  .toBuffer();

                fs.writeFileSync(`public/crests/${e.id}.png`, png);
                console.log('GUARDADO:', e.id);
              } catch (err) {
                console.log('ERROR:', e.id, err.message);
                fallos.push(e.id);
              }
            }

            fs.writeFileSync(
              'public/crests/promocional-pendientes.txt',
              fallos.join('\n') + (fallos.length ? '\n' : '')
            );

            console.log('Pendientes:', fallos);
            if (fallos.length) process.exitCode = 1;
          }

          main().catch(e => {
            console.error(e);
            process.exitCode = 1;
          });
          NODE

      - name: Guardar escudos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests/barrancas.png public/crests/mandarinas.png public/crests/udprovincial.png public/crests/promocional-pendientes.txt
          if ! git diff --cached --quiet; then
            git commit -m "Completar últimos escudos del Promocional Amateur"
            git push
          else
            echo "No se generaron cambios"
          fi
