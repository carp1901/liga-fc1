name: Escudos Promocional Amateur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar escudos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const equipos = [
            ['alumni', 'Alumni Los Hornos'],
            ['atleticopilar', 'Atletico Pilar'],
            ['barrancas', 'Barrancas FC'],
            ['belgranoz', 'Belgrano Zarate'],
            ['buenosairescity', 'Buenos Aires City FC'],
            ['controlorientado', 'Academia Control Orientado'],
            ['defensoresglew', 'Defensores de Glew'],
            ['metalurgico', 'Deportivo Metalurgico'],
            ['estrellaberisso', 'Estrella de Berisso'],
            ['everton', 'Everton La Plata'],
            ['ezeiza', 'FC Ezeiza'],
            ['juventudbernal', 'Juventud de Bernal'],
            ['lasmandarinas', 'Las Mandarinas'],
            ['nauticohacoaj', 'Nautico Hacoaj'],
            ['provincial', 'Provincial Empalme Lobos'],
            ['sat', 'SAT Moreno'],
            ['uribelarrea', 'Uribelarrea FC']
          ];

          const dir = 'public/crests';
          fs.mkdirSync(dir, { recursive: true });

          const headers = {
            'User-Agent': 'Mozilla/5.0 Chrome/125 Safari/537.36'
          };

          async function main() {
            const faltantes = [];

            for (const [id, nombre] of equipos) {
              const destino = path.join(dir, id + '.png');

              if (fs.existsSync(destino)) {
                console.log('YA EXISTE, NO SE TOCA:', destino);
                continue;
              }

              const url = 'https://www.google.com/search?tbm=isch&q=' +
                encodeURIComponent(nombre + ' escudo club futbol');

              try {
                const r = await fetch(url, { headers });
                const html = await r.text();

                const urls = [...html.matchAll(
                  /https?:\\?\/\\?\/[^"' <>]+?\.(?:png|webp|jpe?g)(?:\?[^"' <>]*)?/gi
                )].map(m => m[0].replace(/\\/g, ''));

                console.log(nombre, 'resultados candidatos:', urls.length);
                faltantes.push(id);
              } catch (e) {
                console.log('ERROR:', id, e.message);
                faltantes.push(id);
              }
            }

            fs.writeFileSync(
              path.join(dir, 'promocional-pendientes.txt'),
              [...new Set(faltantes)].join('\n') + '\n'
            );

            console.log('Búsqueda terminada. Revisar promocional-pendientes.txt');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests/promocional-pendientes.txt
          if ! git diff --cached --quiet; then
            git commit -m "Registrar escudos pendientes del Promocional Amateur"
            git push
          fi
