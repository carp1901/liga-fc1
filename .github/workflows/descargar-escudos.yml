
name: Corregir escudos Federal A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Sharp
        run: npm install --no-save sharp

      - name: Descargar escudos correctos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const dir = 'public/crests';
          fs.mkdirSync(dir, { recursive: true });

          const equipos = {
            defbelgranovr: [
              'https://ligasargentinas.com.ar/escudovacio.webp'
            ],
            escobar: [
              'https://ligasargentinas.com.ar/escudovacio.webp'
            ],
            vilelas: [
              'https://commons.wikimedia.org/wiki/Special:FilePath/Club_Atl%C3%A9tico_Defensores_de_Vilelas.png'
            ]
          };

          async function descargar(url) {
            const r = await fetch(url, {
              headers: {
                'User-Agent': 'Mozilla/5.0 LigaFC crest downloader',
                'Accept': 'image/avif,image/webp,image/png,image/*,*/*'
              },
              signal: AbortSignal.timeout(20000)
            });

            if (!r.ok) throw new Error('HTTP ' + r.status);

            const b = Buffer.from(await r.arrayBuffer());
            if (b.length < 1000) throw new Error('Archivo demasiado pequeño');

            const meta = await sharp(b).metadata();
            if (!meta.width || !meta.height) throw new Error('Imagen inválida');
            if (meta.width < 100 || meta.height < 100) {
              throw new Error('Imagen demasiado pequeña');
            }

            return sharp(b)
              .resize(500, 500, {
                fit: 'contain',
                background: { r: 255, g: 255, b: 255, alpha: 0 },
                withoutEnlargement: true
              })
              .png()
              .toBuffer();
          }

          async function main() {
            const faltantes = [];

            for (const [id, urls] of Object.entries(equipos)) {
              let ok = false;

              for (const url of urls) {
                try {
                  console.log('PROBANDO:', id, url);
                  const png = await descargar(url);

                  // No guardar el placeholder de Ligas Argentinas.
                  if (url.includes('escudovacio')) {
                    throw new Error('Se rechaza el escudo genérico');
                  }

                  fs.writeFileSync(path.join(dir, id + '.png'), png);
                  console.log('GUARDADO:', id + '.png');
                  ok = true;
                  break;
                } catch (e) {
                  console.log('NO USADO:', id, e.message);
                }
              }

              if (!ok) {
                faltantes.push(id);
                console.log('FALTA ESCUDO REAL:', id);
              }
            }

            fs.writeFileSync(
              path.join(dir, 'faltantes-tres-escudos.txt'),
              faltantes.join('\n') + (faltantes.length ? '\n' : '')
            );

            console.log('FALTANTES:', faltantes.join(', ') || 'ninguno');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Corregir escudos Federal A"
            git push
          else
            echo "No hubo cambios nuevos"
          fi
