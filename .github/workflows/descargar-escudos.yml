name: Descargar escudos Federal A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar conversor PNG
        run: npm install --no-save sharp

      - name: Buscar escudos en Wikimedia Commons
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const equipos = {
            nuevejulio: '9 de Julio Rafaela Argentina football club',
            alvarado: 'Club Alvarado Mar del Plata',
            atenas: 'Atenas Rio Cuarto football club',
            atsanmartinmza: 'Atletico San Martin Mendoza football club',
            bmitre: 'Bartolome Mitre Posadas football club',
            bocaunidos: 'Boca Unidos Corrientes',
            cipolletti: 'Club Cipolletti football',
            defbelgranovr: 'Defensores de Belgrano Villa Ramallo',
            rincon: 'Deportivo Rincon Neuquen football club',
            soldeamerica: 'Sol de America Formosa football club',
            soldemayo: 'Sol de Mayo Viedma football club',
            tucumancentral: 'Tucuman Central football club',
            costabrava: 'Costa Brava General Pico football club',
            circulo: 'Circulo Deportivo Otamendi football club',
            fadep: 'FADEP Mendoza football club',
            germinal: 'Germinal Rawson football club',
            gbrown: 'Guillermo Brown Puerto Madryn football',
            juventudsl: 'Juventud Unida Universitario San Luis',
            santamarina: 'Santamarina Tandil football club',
            douglashaig: 'Douglas Haig Pergamino football club',
            gimchivilcoy: 'Gimnasia Chivilcoy football club',
            sanmartinformosa: 'San Martin Formosa football club',
            sarmientolb: 'Sarmiento La Banda football club',
            sportivobelgrano: 'Sportivo Belgrano San Francisco',
            huracanlh: 'Huracan Las Heras Mendoza football club',
            olimpo: 'Olimpo Bahia Blanca football club',
            antoniana: 'Juventud Antoniana Salta football club',
            linqueno: 'El Linqueno Lincoln football club',
            indchivilcoy: 'Independiente Chivilcoy football club',
            escobar: 'Atletico Escobar Argentina football club',
            gimcdu: 'Gimnasia Concepcion del Uruguay football club',
            lasparejas: 'Sportivo Las Parejas football club',
            vilelas: 'Defensores de Vilelas football club',
            argmontemaiz: 'Argentino Monte Maiz football club',
            sarmientores: 'Sarmiento Resistencia football club',
            estudiantessl: 'Sportivo Estudiantes San Luis football club'
          };

          const dir = 'public/crests';
          fs.mkdirSync(dir, { recursive: true });

          const pngMagic = Buffer.from([
            137, 80, 78, 71, 13, 10, 26, 10
          ]);

          async function buscar(nombre) {
            const api = new URL(
              'https://commons.wikimedia.org/w/api.php'
            );

            api.searchParams.set('action', 'query');
            api.searchParams.set('format', 'json');
            api.searchParams.set('generator', 'search');
            api.searchParams.set('gsrsearch', nombre + ' logo crest');
            api.searchParams.set('gsrnamespace', '6');
            api.searchParams.set('gsrlimit', '10');
            api.searchParams.set('prop', 'imageinfo');
            api.searchParams.set('iiprop', 'url|mime|size');
            api.searchParams.set('iiurlwidth', '500');

            const respuesta = await fetch(api, {
              headers: {
                'User-Agent': 'LigaFC/1.0 (crest downloader)'
              },
              signal: AbortSignal.timeout(20000)
            });

            if (!respuesta.ok) {
              throw new Error('Commons HTTP ' + respuesta.status);
            }

            const datos = await respuesta.json();
            const paginas = Object.values(
              datos.query?.pages || {}
            );

            for (const pagina of paginas) {
              const info = pagina.imageinfo?.[0];
              if (!info || !info.thumburl) continue;

              // Evitamos fotos pequeñas y archivos que no sean imágenes.
              if (
                info.width < 100 ||
                info.height < 100 ||
                !/^image\//i.test(info.thumbmime || info.mime || '')
              ) continue;

              try {
                const r = await fetch(info.thumburl, {
                  headers: {
                    'User-Agent': 'LigaFC/1.0'
                  },
                  signal: AbortSignal.timeout(20000)
                });

                if (!r.ok) continue;

                const original = Buffer.from(
                  await r.arrayBuffer()
                );

                if (original.length < 300) continue;

                const png = await sharp(original)
                  .resize(500, 500, {
                    fit: 'inside',
                    withoutEnlargement: true
                  })
                  .png()
                  .toBuffer();

                if (png.subarray(0, 8).equals(pngMagic)) {
                  return png;
                }
              } catch (e) {
                console.log('Imagen descartada:', e.message);
              }
            }

            throw new Error('Sin imagen disponible');
          }

          async function main() {
            const faltantes = [];
            let nuevos = 0;
            let existentes = 0;

            for (const [id, nombre] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');

              // Conservar cualquier escudo PNG válido existente.
              if (fs.existsSync(destino)) {
                const actual = fs.readFileSync(destino);
                if (actual.subarray(0, 8).equals(pngMagic)) {
                  console.log('CONSERVADO:', id);
                  existentes++;
                  continue;
                }
              }

              try {
                const png = await buscar(nombre);
                fs.writeFileSync(destino, png);
                console.log('DESCARGADO:', id + '.png');
                nuevos++;
              } catch (e) {
                console.log('FALTA:', id, e.message);
                faltantes.push(id);
              }
            }

            fs.writeFileSync(
              path.join(dir, 'faltantes-federal-a.txt'),
              faltantes.join('\n') +
                (faltantes.length ? '\n' : '')
            );

            console.log('NUEVOS:', nuevos);
            console.log('CONSERVADOS:', existentes);
            console.log('FALTANTES:', faltantes.length);
            console.log(faltantes.join(', ') || 'ninguno');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Guardar escudos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Descargar escudos del Federal A"
            git push
          else
            echo "No hubo cambios para guardar"
          fi
