name: Revisar escudos Promocional Amateur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Retirar solamente los cinco archivos incorrectos
        run: |
          mkdir -p public/crests
          rm -f public/crests/alumni.png
          rm -f public/crests/bacity.png
          rm -f public/crests/barrancas.png
          rm -f public/crests/belgranozarate.png
          rm -f public/crests/controlorientado.png

          cat > public/crests/promocional-pendientes.txt <<'EOF'
          alumni
          bacity
          barrancas
          belgranozarate
          controlorientado
          atpilar
          defglew
          metalurgico
          estrellaberisso
          everton
          fcezeiza
          juventudbernal
          mandarinas
          hacoaj
          sat
          udprovincial
          uribelarrea
          EOF

          echo "Se retiraron solo los cinco PNG incorrectos."
          echo "Los otros escudos no fueron modificados."

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Retirar imágenes incorrectas del Promocional Amateur"
            git push
          else
            echo "No hay cambios para guardar"
          fi
