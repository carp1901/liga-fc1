
name: Descargar escudos argentinos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar escudos desde catálogo
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          const equipos = {
            mitre:'club-atletico-mitre',
            ciudadbolivar:'ciudad-de-bolivar',
            madryn:'deportivo-madryn',
            sanmiguel:'san-miguel',
            midland:'ferrocarril-midland',
            agropecuario:'agropecuario-argentino',
            maipu:'deportivo-maipu',
            tristansuarez:'tristan-suarez',
            guemes:'guemes',
            argentinomerlo:'argentino-de-merlo',
            brownadrogue:'brown-de-adrogue',
            liniers:'liniers',
            comunicaciones:'comunicaciones',
            defensoresunidos:'defensores-unidos',
            camioneros:'deportivo-camioneros',
            laferrere:'deportivo-laferrere',
            deportivomerlo:'deportivo-merlo',
            flandria:'flandria',
            ituzaingo:'ituzaingo',
            realpilar:'real-pilar',
            sanmartinburzaco:'san-martin-de-burzaco',
            uai:'uai-urquiza',
            villadalmine:'villa-dalmine',
            villasancarlos:'villa-san-carlos',
            alem:'leandro-n-alem',
            mercedes:'club-mercedes',
            juventudunida:'juventud-unida',
            estrelladelsur:'estrella-del-sur',
            argentinorosario:'argentino-de-rosario',
            victorianoarenas:'victoriano-arenas',
            sacachispas:'sacachispas',
            berazategui:'berazategui',
            paraguayo:'deportivo-paraguayo',
            jjurquiza:'justo-jose-de-urquiza',
            cambaceres:'defensores-de-cambaceres',
            puertonuevo:'puerto-nuevo',
            lugano:'lugano',
            centroespanol:'centro-espanol',
            atlas:'atlas',
            canuelas:'canuelas',
            centralballester:'central-ballester',
            centralcordobarosario:'central-cordoba-de-rosario',
            claypole:'claypole',
            espanol:'deportivo-espanol',
            muniz:'deportivo-muniz',
            fenix:'fenix',
            lamadrid:'general-lamadrid',
            leones:'leones-de-rosario',
            lujan:'lujan',
            yupanqui:'yupanqui'
          };

          function get(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {
                headers: {'User-Agent':'LigaFC'}
              }, res => {
                if ([301,302,303,307,308].includes(res.statusCode)) {
                  res.resume();
                  return reject(new Error('Redirección'));
                }
                if (res.statusCode !== 200) {
                  res.resume();
                  return reject(new Error('HTTP '+res.statusCode));
                }
                const chunks = [];
                res.on('data', c => chunks.push(c));
                res.on('end', () => resolve(Buffer.concat(chunks)));
              }).on('error', reject);
            });
          }

          async function main() {
            const url = 'https://gist.githubusercontent.com/BabaProMessi/5865807334d8d3e9b6b7dfe9c08e9a04/raw/gistfile1.txt';
            const catalogo = JSON.parse((await get(url)).toString());
            const argentinos = catalogo.filter(x => x.country === 'argentina');
            const dir = 'public/crests';
            fs.mkdirSync(dir, {recursive:true});
            const faltantes = [];
            let descargados = 0;
            let conservados = 0;

            for (const [id, slug] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');

              if (fs.existsSync(destino) &&
                  fs.statSync(destino).size > 500) {
                conservados++;
                console.log('CONSERVADO:', id);
                continue;
              }

              const club = argentinos.find(x => x.slug === slug);
              if (!club || !club.logo) {
                console.log('NO FIGURA EN CATÁLOGO:', id, slug);
                faltantes.push(id);
                continue;
              }

              try {
                const imagen = await get(club.logo);
                if (imagen.length < 500 ||
                    imagen[0] !== 0x89 ||
                    imagen[1] !== 0x50 ||
                    imagen[2] !== 0x4e ||
                    imagen[3] !== 0x47) {
                  throw new Error('La descarga no es un PNG válido');
                }
                fs.writeFileSync(destino, imagen);
                descargados++;
                console.log('DESCARGADO:', id);
              } catch (e) {
                console.log('ERROR:', id, e.message);
                faltantes.push(id);
              }
            }

            fs.writeFileSync(
              path.join(dir,'faltantes.txt'),
              faltantes.join('\n')
            );
            console.log('Descargados:', descargados);
            console.log('Conservados:', conservados);
            console.log('Faltantes:', faltantes.length);
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Descargar los 9 escudos de Primera Nacional
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const equipos = {
            agropecuario: 'https://www.footylogos.com/downloads/logo/agropecuario-argentino-logo-footylogos.png',
            madryn: 'https://www.footylogos.com/downloads/logo/deportivo-madryn-logo-footylogos.png',
            maipu: 'https://www.footylogos.com/downloads/logo/deportivo-maipu-logo-footylogos.png',
            guemes: 'https://www.footylogos.com/downloads/logo/guemes-logo-footylogos.png',
            mitre: 'https://www.footylogos.com/downloads/logo/mitre-santiago-del-estero-logo-footylogos.png',
            sanmiguel: 'https://www.footylogos.com/downloads/logo/san-miguel-logo-footylogos.png',
            midland: 'https://www.footylogos.com/downloads/logo/ferrocarril-midland-logo-footylogos.png',
            ciudadbolivar: 'https://www.footylogos.com/downloads/logo/ciudad-de-bolivar-logo-footylogos.png',
            tristansuarez: 'https://www.footylogos.com/downloads/logo/tristan-suarez-logo-footylogos.png'
          };

          async function main() {
            const dir = 'public/crests';
            fs.mkdirSync(dir, { recursive: true });

            const completados = new Set();
            const fallidos = [];

            for (const [id, url] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');

              try {
                if (fs.existsSync(destino)) {
                  const existente = fs.readFileSync(destino);
                  const cabecera = existente.subarray(0, 4);

                  if (
                    existente.length > 500 &&
                    cabecera.equals(Buffer.from([0x89, 0x50, 0x4e, 0x47]))
                  ) {
                    console.log('YA EXISTÍA:', id + '.png');
                    completados.add(id);
                    continue;
                  }
                }

                const respuesta = await fetch(url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 LigaFC',
                    'Referer': 'https://www.footylogos.com/'
                  }
                });

                if (!respuesta.ok) {
                  throw new Error('HTTP ' + respuesta.status);
                }

                const imagen = Buffer.from(
                  await respuesta.arrayBuffer()
                );

                const cabecera = imagen.subarray(0, 4);
                const esPng = cabecera.equals(
                  Buffer.from([0x89, 0x50, 0x4e, 0x47])
                );

                if (imagen.length < 500 || !esPng) {
                  throw new Error('La descarga no es un PNG válido');
                }

                fs.writeFileSync(destino, imagen);
                completados.add(id);
                console.log('DESCARGADO:', id + '.png');

              } catch (error) {
                fallidos.push(id);
                console.log('FALLÓ:', id, error.message);
              }
            }

            const archivoFaltantes = path.join(dir, 'faltantes.txt');
            const actuales = fs.existsSync(archivoFaltantes)
              ? fs.readFileSync(archivoFaltantes, 'utf8')
                  .split(/\r?\n/)
                  .map(x => x.trim())
                  .filter(Boolean)
              : [];

            const pendientes = new Set(
              actuales.filter(
                id => id !== 'tristan' && !completados.has(id)
              )
            );

            for (const id of fallidos) {
              pendientes.add(id);
            }

            fs.writeFileSync(
              archivoFaltantes,
              [...pendientes].join('\n') +
                (pendientes.size ? '\n' : '')
            );

            fs.writeFileSync(
              path.join(dir, 'fuentes.txt'),
              'Fuente de los escudos añadidos en este bloque: ' +
              'FootyLogos.com — https://www.footylogos.com/\n'
            );

            console.log('RESULTADO:', completados.size + '/9 escudos disponibles');
            console.log(
              'Fallidos:',
              fallidos.length ? fallidos.join(', ') : 'ninguno'
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Guardar escudos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Agregar escudos argentinos faltantes"
            git push
          else
            echo "No hubo archivos nuevos para guardar"
          fi
