name: Corregir escudos Promocional Amateur

on:
workflow_dispatch:

permissions:
contents: write

jobs:
escudos:
runs-on: ubuntu-latest

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Preparar herramientas
    run: |
      npm init -y
      npm install sharp

  - name: Descargar y corregir los escudos
    run: |
      mkdir -p public/crests
      cat > /tmp/escudos.cjs <<'EOF'
      const fs = require('fs');
      const sharp = require('sharp');

      async function descargar(url) {
        const r = await fetch(url, {
          headers: { 'User-Agent': 'Mozilla/5.0' },
          redirect: 'follow'
        });
        if (!r.ok) throw new Error('HTTP ' + r.status + ' en ' + url);
        return Buffer.from(await r.arrayBuffer());
      }

      async function guardar(id, fuentes, quitarBlanco = false) {
        let buf, error;
        for (const url of fuentes) {
          try {
            const b = await descargar(url);
            const meta = await sharp(b, { animated: false }).metadata();
            if (!meta.width || !meta.height) throw new Error('No es una imagen válida');

            let img = sharp(b).rotate().resize(500, 500, {
              fit: 'contain',
              background: { r: 0, g: 0, b: 0, alpha: 0 }
            }).ensureAlpha();

            if (quitarBlanco) {
              img = img.raw().toBuffer({ resolveWithObject: true }).then(({data, info}) => {
                for (let i = 0; i < data.length; i += info.channels) {
                  const r=data[i], g=data[i+1], b=data[i+2];
                  if (r > 245 && g > 245 && b > 245) data[i+3] = 0;
                }
                return sharp(data, {raw: info}).png().toBuffer();
              });
              buf = await img;
            } else {
              buf = await img.png().toBuffer();
            }

            if (buf.length < 1000) throw new Error('Archivo demasiado pequeño');
            fs.writeFileSync(`public/crests/${id}.png`, buf);
            console.log('GUARDADO:', id, url);
            return true;
          } catch (e) {
            error = e;
            console.log('Falló fuente:', url, e.message);
          }
        }
        console.log('PENDIENTE:', id, error?.message || 'Sin fuente válida');
        return false;
      }

      (async () => {
        const resultados = {};

        resultados.mandarinas = await guardar('mandarinas', [
          'https://commons.wikimedia.org/wiki/Special:FilePath/Club%20Deportivo%20y%20Fomento%20Las%20Mandarinas.png'
        ], true);

        resultados.udprovincial = await guardar('udprovincial', [
          'https://w7.pngwing.com/pngs/989/604/png-transparent-club-union-deportiva-provincial-de-empalme-lobos-hd-logo.png',
          'https://futbolinterior.com.ar/images/stories/clubes/34provincial.gif'
        ]);

        console.log('RESULTADO:', resultados);
        if (!resultados.mandarinas || !resultados.udprovincial) process.exitCode = 1;
      })();
      EOF
      node /tmp/escudos.cjs

  - name: Guardar cambios
    if: always()
    run: |
      git add public/crests/mandarinas.png public/crests/udprovincial.png || true
      if ! git diff --cached --quiet; then
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Corregir escudos de Mandarinas y Provincial"
        git push
      else
        echo "No hay archivos nuevos para guardar."
      fi
