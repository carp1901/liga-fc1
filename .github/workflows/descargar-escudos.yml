name: Descargar escudos argentinos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar escudos de FootyLogos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const equipos = {
            agropecuario: 'agropecuario-argentino',
            madryn: 'deportivo-madryn',
            maipu: 'deportivo-maipu',
            guemes: 'guemes',
            mitre: 'mitre-santiago-del-estero',
            sanmiguel: 'san-miguel',
            midland: 'ferrocarril-midland',
            ciudadbolivar: 'ciudad-de-bolivar',
            tristansuarez: 'tristan-suarez',
            gimnasia: 'gimnasia-y-esgrima-lp',
            argentinomerlo: 'argentino-de-merlo',
            brownadrogue: 'brown-de-adrogue',
            liniers: 'liniers',
            comunicaciones: 'comunicaciones',
            defensoresunidos: 'defensores-unidos',
            camioneros: 'deportivo-camioneros',
            laferrere: 'deportivo-laferrere',
            deportivomerlo: 'deportivo-merlo',
            flandria: 'flandria',
            ituzaingo: 'ituzaingo',
            realpilar: 'real-pilar',
            sanmartinburzaco: 'san-martin-de-burzaco',
            uai: 'uai-urquiza',
            villadalmine: 'villa-dalmine',
            villasancarlos: 'villa-san-carlos',
            alem: 'leandro-n-alem',
            mercedes: 'club-mercedes',
            juventudunida: 'juventud-unida-san-miguel',
            estrelladelsur: 'estrella-del-sur',
            argentinorosario: 'argentino-de-rosario',
            victorianoarenas: 'victoriano-arenas',
            sacachispas: 'sacachispas',
            berazategui: 'berazategui',
            paraguayo: 'deportivo-paraguayo',
            jjurquiza: 'jj-urquiza',
            cambaceres: 'defensores-de-cambaceres',
            puertonuevo: 'puerto-nuevo',
            lugano: 'lugano',
            centroespanol: 'centro-espanol',
            atlas: 'atlas-argentina',
            canuelas: 'canuelas',
            centralballester: 'central-ballester',
            centralcordobarosario: 'central-cordoba-rosario',
            claypole: 'claypole',
            espanol: 'deportivo-espanol',
            muniz: 'deportivo-muniz',
            fenix: 'fenix',
            lamadrid: 'general-lamadrid',
            leones: 'leones-de-rosario',
            lujan: 'lujan',
            yupanqui: 'yupanqui'
          };

          async function main() {
            const dir = 'public/crests';
            fs.mkdirSync(dir, { recursive: true });

            const faltantes = [];
            let descargados = 0;

            for (const [id, slug] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');
              const url =
                'https://www.footylogos.com/downloads/logo/' +
                slug + '-logo-footylogos.png';

              try {
                const respuesta = await fetch(url, {
                  headers: {
                    'User-Agent': 'Mozilla/5.0 LigaFC',
                    'Referer': 'https://www.footylogos.com/'
                  },
                  redirect: 'follow'
                });

                if (!respuesta.ok) {
                  throw new Error('HTTP ' + respuesta.status);
                }

                const imagen = Buffer.from(
                  await respuesta.arrayBuffer()
                );

                const png = Buffer.from([137, 80, 78, 71]);

                if (
                  imagen.length < 500 ||
                  !imagen.subarray(0, 4).equals(png)
                ) {
                  throw new Error('No es un PNG válido');
                }

                fs.writeFileSync(destino, imagen);
                descargados++;
                console.log('DESCARGADO:', id + '.png');
              } catch (error) {
                faltantes.push(id);
                console.log('FALLÓ:', id, error.message);
              }
            }

            fs.writeFileSync(
              path.join(dir, 'faltantes.txt'),
              faltantes.join('\n') +
                (faltantes.length ? '\n' : '')
            );

            console.log('TOTAL DESCARGADOS:', descargados);
            console.log('TOTAL FALLIDOS:', faltantes.length);
            console.log('FALTANTES:', faltantes.join(', ') || 'ninguno');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Guardar escudos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Descargar escudos argentinos"
            git push
          else
            echo "No hubo cambios para guardar"
          fi
