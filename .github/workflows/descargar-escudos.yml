name: Descargar escudos Federal A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar conversor
        run: npm install --no-save sharp

      - name: Descargar escudos desde Paladar Negro
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const base =
            'https://paladarnegro.net/escudoteca/argentina/federala/png/';

          const equipos = {
            nuevejulio: ['9_de_julio'],
            alvarado: ['alvarado'],
            atenas: ['atenas', 'atenas_rio_cuarto'],
            atsanmartinmza: ['atletico_san_martin', 'san_martin_mendoza'],
            bmitre: ['bartolome_mitre'],
            bocaunidos: ['boca_unidos'],
            cipolletti: ['cipolletti'],

            defbelgranovr: [
              'defensores_de_belgrano_villa_ramallo',
              'defensores_belgrano_villa_ramallo',
              'defensores_de_belgrano_vr',
              'defensores_de_belgrano'
            ],

            rincon: [
              'deportivo_rincon',
              'deportivo_rincon_de_los_sauces',
              'rincon_de_los_sauces'
            ],

            soldeamerica: ['sol_de_america'],
            soldemayo: ['sol_de_mayo'],
            tucumancentral: ['tucuman_central'],
            costabrava: ['costa_brava'],
            circulo: ['circulo_deportivo'],

            fadep: [
              'fadep',
              'fundacion_amigos_por_el_deporte',
              'fundacion_amigos_del_deporte'
            ],

            germinal: ['germinal'],

            gbrown: [
              'guillermo_brown',
              'brown_de_puerto_madryn',
              'guillermo_brown_de_puerto_madryn'
            ],

            juventudsl: [
              'juventud_unida_universitario',
              'juventud_unida_de_san_luis',
              'juventud_unida_san_luis',
              'juventud_unida_sl'
            ],

            santamarina: ['santamarina', 'santamarina_tandil'],
            douglashaig: ['douglas_haig'],
            gimchivilcoy: ['gimnasia_de_chivilcoy', 'gimnasia_chivilcoy'],
            sanmartinformosa: ['san_martin_formosa'],

            sarmientolb: [
              'sarmiento_la_banda',
              'sarmiento_de_la_banda',
              'club_sarmiento'
            ],

            sportivobelgrano: ['sportivo_belgrano'],
            huracanlh: ['huracan_las_heras'],
            olimpo: ['olimpo'],
            antoniana: ['juventud_antoniana'],
            linqueno: ['el_linqueno', 'linqueno'],
            indchivilcoy: ['independiente_chivilcoy'],

            escobar: [
              'escobar_fc',
              'atletico_escobar',
              'deportivo_escobar'
            ],

            gimcdu: [
              'gimnasia_concepcion_del_uruguay',
              'gimnasia_de_concepcion_del_uruguay',
              'gimnasia_cdu'
            ],

            lasparejas: [
              'sportivo_las_parejas',
              'sportivo_de_las_parejas',
              'las_parejas'
            ],

            vilelas: [
              'defensores_de_vilelas',
              'defensores_de_puerto_vilelas',
              'defensores_vilelas'
            ],

            argmontemaiz: ['argentino_mm', 'argentino_monte_maiz'],
            sarmientores: ['sarmiento_resistencia'],
            estudiantessl: ['sportivo_estudiantes', 'estudiantes_san_luis']
          };

          const dir = 'public/crests';
          fs.mkdirSync(dir, { recursive: true });

          const pngMagic = Buffer.from([
            137, 80, 78, 71, 13, 10, 26, 10
          ]);

          async function descargar(url) {
            const r = await fetch(url, {
              headers: { 'User-Agent': 'LigaFC crest downloader' },
              signal: AbortSignal.timeout(15000)
            });

            if (!r.ok) {
              throw new Error('HTTP ' + r.status);
            }

            const buffer = Buffer.from(await r.arrayBuffer());

            if (buffer.length < 300) {
              throw new Error('Archivo demasiado pequeño');
            }

            const metadata = await sharp(buffer).metadata();

            if (!metadata.width || !metadata.height) {
              throw new Error('Imagen inválida');
            }

            const png = await sharp(buffer)
              .resize(500, 500, {
                fit: 'inside',
                withoutEnlargement: true
              })
              .png()
              .toBuffer();

            if (!png.subarray(0, 8).equals(pngMagic)) {
              throw new Error('La conversión a PNG falló');
            }

            return png;
          }

          async function main() {
            let nuevos = 0;
            let conservados = 0;
            const faltantes = [];

            for (const [id, nombres] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');

              if (fs.existsSync(destino)) {
                const actual = fs.readFileSync(destino);

                if (actual.subarray(0, 8).equals(pngMagic)) {
                  console.log('CONSERVADO:', id);
                  conservados++;
                  continue;
                }
              }

              let imagen = null;

              for (const nombre of nombres) {
                const url = base + encodeURIComponent(nombre) + '.png';

                try {
                  imagen = await descargar(url);
                  console.log('ENCONTRADO:', url, '->', id + '.png');
                  break;
                } catch (e) {
                  console.log('NO DISPONIBLE:', nombre + '.png', e.message);
                }
              }

              if (imagen) {
                fs.writeFileSync(destino, imagen);
                console.log('GUARDADO:', id + '.png');
                nuevos++;
              } else {
                console.log('FALTANTE:', id);
                faltantes.push(id);
              }

              await new Promise(resolve => setTimeout(resolve, 400));
            }

            fs.writeFileSync(
              path.join(dir, 'faltantes-federal-a.txt'),
              faltantes.join('\n') + (faltantes.length ? '\n' : '')
            );

            console.log('-------------------------');
            console.log('NUEVOS:', nuevos);
            console.log('CONSERVADOS:', conservados);
            console.log('FALTANTES:', faltantes.length);
            console.log(faltantes.join(', ') || 'ninguno');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Guardar escudos descargados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar escudos Federal A desde Paladar Negro"
            git push
          else
            echo "No hubo cambios para guardar"
          fi
