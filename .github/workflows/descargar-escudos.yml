name: Quitar fondo blanco de escudos

'on':
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quitar-fondo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Sharp
        run: npm install --no-save sharp

      - name: Quitar fondo blanco exterior
        run: |
          cat > limpiar.js <<'NODE'
          const fs = require('fs');
          const sharp = require('sharp');

          const ids = ['udprovincial', 'defbelgranovr', 'vilelas'];

          async function limpiar(id) {
            const archivo = `public/crests/${id}.png`;

            if (!fs.existsSync(archivo)) {
              throw new Error(`No existe ${archivo}`);
            }

            const { data, info } = await sharp(archivo)
              .ensureAlpha()
              .raw()
              .toBuffer({ resolveWithObject: true });

            const { width, height, channels } = info;
            const visitados = new Uint8Array(width * height);
            const cola = new Int32Array(width * height);
            let inicio = 0;
            let fin = 0;

            function agregar(x, y) {
              if (x < 0 || y < 0 || x >= width || y >= height) return;

              const p = y * width + x;
              if (visitados[p]) return;

              const i = p * channels;
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];

              if (Math.min(r, g, b) < 218 ||
                  Math.max(r, g, b) - Math.min(r, g, b) > 48) return;

              visitados[p] = 1;
              cola[fin++] = p;
            }

            for (let x = 0; x < width; x++) {
              agregar(x, 0);
              agregar(x, height - 1);
            }

            for (let y = 0; y < height; y++) {
              agregar(0, y);
              agregar(width - 1, y);
            }

            while (inicio < fin) {
              const p = cola[inicio++];
              data[p * channels + 3] = 0;

              const x = p % width;
              const y = Math.floor(p / width);

              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx || dy) agregar(x + dx, y + dy);
                }
              }
            }

            const salida = await sharp(data, {
              raw: { width, height, channels }
            }).png().toBuffer();

            fs.writeFileSync(archivo, salida);
            console.log(`CORREGIDO: ${id}; fondo exterior eliminado`);
          }

          async function main() {
            for (const id of ids) await limpiar(id);
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          node limpiar.js

      - name: Guardar cambios
        run: |
          git add public/crests/udprovincial.png public/crests/defbelgranovr.png public/crests/vilelas.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Quitar fondos blancos de escudos"
            git push
          else
            echo "No se detectaron cambios."
          fi
