
name: Completar escudos faltantes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/descargar-escudos.yml'

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Sharp
        run: npm install --no-save sharp

      - name: Descargar y convertir escudos
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const dir = 'public/crests';
          fs.mkdirSync(dir, { recursive: true });

          const equipos = {
            defbelgranovr: [
              'https://paladarnegro.net/escudoteca/argentina/federala/png/defensores_belgrano_vr.png',
              'https://paladarnegro.net/escudoteca/argentina/federala/png/defensores_de_belgrano_villa_ramallo.png'
            ],
            tucumancentral: [
              'https://commons.wikimedia.org/wiki/Special:FilePath/Escudo_Club_Tucum%C3%A1n_Central.svg'
            ],
            fadep: [
              'https://commons.wikimedia.org/wiki/Special:FilePath/Escudo_Fundaci%C3%B3n_Amigos_por_el_Deporte.png',
              'https://paladarnegro.net/escudoteca/argentina/federala/png/fadep.png'
            ],
            escobar: [
              'https://paladarnegro.net/escudoteca/argentina/federala/png/escobar_fc.png',
              'https://paladarnegro.net/escudoteca/argentina/federala/png/atletico_escobar.png'
            ],
            lasparejas: [
              'https://commons.wikimedia.org/wiki/Special:FilePath/Sportivo_lasparejas_2021.png',
              'https://paladarnegro.net/escudoteca/argentina/federala/png/sportivo_las_parejas.png'
            ],
            vilelas: [
              'https://paladarnegro.net/escudoteca/argentina/federala/png/defensores_de_vilelas.png',
              'https://paladarnegro.net/escudoteca/argentina/federala/png/defensores_de_puerto_vilelas.png'
            ]
          };

          async function main() {
            const faltantes = [];

            for (const [id, urls] of Object.entries(equipos)) {
              const destino = path.join(dir, id + '.png');

              if (fs.existsSync(destino)) {
                try {
                  const meta = await sharp(destino).metadata();
                  if (meta.width && meta.height) {
                    console.log('YA EXISTE:', id);
                    continue;
                  }
                } catch (_) {}
              }

              let guardado = false;

              for (const url of urls) {
                try {
                  console.log('PROBANDO:', url);

                  const r = await fetch(url, {
                    headers: {
                      'User-Agent': 'LigaFC/1.0 crest downloader'
                    },
                    signal: AbortSignal.timeout(20000)
                  });

                  if (!r.ok) {
                    throw new Error('HTTP ' + r.status);
                  }

                  const buffer = Buffer.from(await r.arrayBuffer());

                  if (buffer.length < 300) {
                    throw new Error('Respuesta demasiado pequeña');
                  }

                  const png = await sharp(buffer, { failOn: 'error' })
                    .resize(500, 500, {
                      fit: 'inside',
                      withoutEnlargement: true
                    })
                    .png()
                    .toBuffer();

                  await sharp(png).metadata();
                  fs.writeFileSync(destino, png);

                  console.log('GUARDADO:', destino);
                  guardado = true;
                  break;
                } catch (e) {
                  console.log('FALLO:', id, e.message);
                }
              }

              if (!guardado) {
                faltantes.push(id);
                console.log('SIGUE FALTANDO:', id);
              }
            }

            fs.writeFileSync(
              path.join(dir, 'faltantes-federal-a.txt'),
              faltantes.join('\n') + (faltantes.length ? '\n' : '')
            );

            console.log('RESULTADO FINAL');
            console.log('Faltantes:', faltantes.join(', ') || 'ninguno');
          }

          main().catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE

      - name: Guardar archivos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/crests
          if ! git diff --cached --quiet; then
            git commit -m "Completar escudos faltantes Federal A"
            git push
          else
            echo "No hubo cambios nuevos"
          fi
