name: Validar e integrar borradores Federal A 2026
on:
  push:
    branches: [main]
    paths:
      - 'planteles/borradores/federal-a-2026-tanda-2/**'
      - 'planteles/borradores/federal-a-2026-tanda-3/**'
      - 'planteles/borradores/federal-a-2026-tanda-4/**'
      - 'test-federal-a-draft.js'
      - 'test-federal-a-tanda2.js'
      - 'test-federal-a-tanda3.js'
      - 'test-federal-a-tanda4.js'
      - 'test-federal-a-runtime.js'
      - 'import-squads.js'
      - '.github/workflows/test-federal-a-draft.yml'
  pull_request:
    paths:
      - 'planteles/borradores/federal-a-2026/**'
      - 'planteles/borradores/federal-a-2026-tanda-1/**'
      - 'planteles/borradores/federal-a-2026-tanda-2/**'
      - 'planteles/borradores/federal-a-2026-tanda-3/**'
      - 'planteles/borradores/federal-a-2026-tanda-4/**'
      - 'test-federal-a-draft.js'
      - 'test-federal-a-tanda2.js'
      - 'test-federal-a-tanda3.js'
      - 'test-federal-a-tanda4.js'
      - 'test-federal-a-runtime.js'
      - 'import-squads.js'
      - '.github/workflows/test-federal-a-draft.yml'
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxis del importador
        run: node --check import-squads.js
      - name: Validar primera tanda
        run: node test-federal-a-draft.js
      - name: Validar segunda tanda y mínimo 18 jugadores
        run: node test-federal-a-tanda2.js
      - name: Validar tercera tanda y mínimo 18 jugadores
        run: node test-federal-a-tanda3.js
      - name: Validar cuarta tanda y mínimo 18 jugadores
        run: node test-federal-a-tanda4.js
      - name: Validar importación de la primera tanda sin publicar
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-1/completo.csv --dry-run
      - name: Integrar primera tanda en runtime de la rama
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-1/completo.csv
      - name: Validar importación de la segunda tanda sin publicar
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-2/completo.csv --dry-run
      - name: Integrar segunda tanda en runtime de la rama
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-2/completo.csv
      - name: Validar importación de la tercera tanda sin publicar
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-3/completo.csv --dry-run
      - name: Integrar tercera tanda en runtime de la rama
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-3/completo.csv
      - name: Validar importación de la cuarta tanda sin publicar
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-4/completo.csv --dry-run
      - name: Integrar cuarta tanda en runtime de la rama
        run: node import-squads.js planteles/borradores/federal-a-2026-tanda-4/completo.csv
      - name: Verificar runtime de las cuatro tandas y mínimo global
        run: node test-federal-a-runtime.js
      - name: Guardar runtime generado en la rama del PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/squads.json public/squads.js public/squads-meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integrar planteles reales Federal A 2026 — tanda 4'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
