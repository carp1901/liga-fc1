name: Validar bloque de Primera Nacional
on:
  push:
    branches: [primera-nacional-2026-bloques]
    paths:
      - 'planteles/primera-nacional-2026-bloque1.csv'
      - 'planteles/primera-nacional-2026-bloque2.csv'
      - 'planteles/primera-nacional-2026-bloque3.csv'
      - 'planteles/primera-nacional-2026-bloque4.csv'
      - 'planteles/primera-nacional-2026-bloque5.csv'
      - 'planteles/primera-nacional-2026-bloque6.csv'
      - 'planteles/primera-nacional-2026.csv'
      - 'test-primera-nacional.js'
      - 'test-primera-nacional-import.js'
      - 'test-squads.js'
      - 'import-squads.js'
      - 'public/data.js'
      - '.github/workflows/validar-primera-nacional.yml'
  pull_request:
    paths:
      - 'planteles/primera-nacional-2026-bloque1.csv'
      - 'planteles/primera-nacional-2026-bloque2.csv'
      - 'planteles/primera-nacional-2026-bloque3.csv'
      - 'planteles/primera-nacional-2026-bloque4.csv'
      - 'planteles/primera-nacional-2026-bloque5.csv'
      - 'planteles/primera-nacional-2026-bloque6.csv'
      - 'planteles/primera-nacional-2026.csv'
      - 'test-primera-nacional.js'
      - 'import-squads.js'
      - 'public/data.js'
      - '.github/workflows/validar-primera-nacional.yml'
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxis
        run: |
          node --check public/data.js
          node --check import-squads.js
          node --check test-primera-nacional.js
          node --check test-primera-nacional-import.js
          node --check test-squads.js
      - name: Auditar bloque, edades, dorsales y fuentes
        run: node test-primera-nacional.js
      - name: Validar compatibilidad con el importador sin publicar
        run: |
          node import-squads.js planteles/primera-nacional-2026.csv --dry-run
      - name: Importar planteles en la rama de trabajo
        if: github.event_name == 'push'
        run: node import-squads.js planteles/primera-nacional-2026.csv
      - name: Validar atributos y datos cargados en el motor
        if: github.event_name == 'push'
        run: |
          node test-primera-nacional-import.js
          node test-squads.js
      - name: Guardar importación en la rama de trabajo
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/squads.json public/squads-meta.json
          if git diff --cached --quiet; then
            echo 'No hay cambios de planteles para guardar.'
          else
            git commit -m 'Importar planteles de Primera Nacional 2026'
            git push origin HEAD:$GITHUB_REF_NAME
          fi
