name: Balance audit - Primera Nacional y Primera
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test-balance.js'
      - 'test-promotion-balance.js'
      - 'test-national-career-balance.js'
      - 'test-auto-xi.js'
      - '.github/workflows/balance.yml'
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.js'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.js'
      - 'test-balance.js'
      - 'test-promotion-balance.js'
      - 'test-national-career-balance.js'
      - 'test-auto-xi.js'
      - '.github/workflows/balance.yml'
permissions:
  contents: read
concurrency:
  group: balance-audit-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar formaciones y roles específicos
        run: node test-auto-xi.js
      - name: Validar ascensos y descensos
        run: node test-promotion-balance.js | tee promotion-report.json
      - name: Simular 60 temporadas de Primera
        run: node test-balance.js | tee balance-report.json
      - name: Simular 60 temporadas de carrera desde Primera Nacional
        run: node test-national-career-balance.js | tee national-career-report.json
      - name: Publicar resumen
        if: always()
        run: |
          echo '## Auditoría de equilibrio de Primera y Primera Nacional' >> "$GITHUB_STEP_SUMMARY"
          for f in balance-report.json promotion-report.json national-career-report.json; do
            if [ -s "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Conservar informes de auditoría (sin commit ni push)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-equilibrio
          path: |
            balance-report.json
            promotion-report.json
            national-career-report.json
          if-no-files-found: ignore
