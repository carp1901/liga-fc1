name: Balance audit - Primera
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test-balance.js'
      - 'test-promotion-balance.js'
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.js'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.js'
      - 'test-balance.js'
      - 'test-promotion-balance.js'
      - '.github/workflows/balance.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Simular temporadas y comparar tácticas
        run: node test-balance.js | tee balance-report.json
      - name: Validar ascensos y descensos
        run: node test-promotion-balance.js | tee promotion-report.json
      - name: Publicar resumen
        if: always()
        run: |
          echo '## Auditoría de equilibrio de Primera' >> "$GITHUB_STEP_SUMMARY"
          if [ -s balance-report.json ]; then
            echo 'Resultados de temporadas y comparación táctica:' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat balance-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s promotion-report.json ]; then
            echo '## Ajustes por ascensos y descensos' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat promotion-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe de auditoría
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p planteles
          cp balance-report.json planteles/auditoria-equilibrio-primera.json
          cp promotion-report.json planteles/auditoria-ajustes-ascensos-descensos.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planteles/auditoria-equilibrio-primera.json planteles/auditoria-ajustes-ascensos-descensos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Primera balance audit results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('balance-report.json') != ''
        with:
          name: auditoria-equilibrio-primera
          path: |
            balance-report.json
            promotion-report.json
