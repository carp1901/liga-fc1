name: Balance audit - Primera
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, auditoria-equilibrio-primera]
    paths:
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.json'
      - 'public/player-development.js'
      - 'test-balance.js'
      - '.github/workflows/balance.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Simular temporadas y comparar tácticas
        run: node test-balance.js > balance-report.json
      - name: Publicar resultados
        if: always()
        run: |
          echo '## Auditoría de equilibrio de Primera' >> "$GITHUB_STEP_SUMMARY"
          if [ -s balance-report.json ]; then
            echo 'Resultados de temporadas y comparación táctica:' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat balance-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar informe en la rama de auditoría
        if: success()
        run: |
          mkdir -p planteles
          cp balance-report.json planteles/auditoria-equilibrio-primera.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planteles/auditoria-equilibrio-primera.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Primera balance audit results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('balance-report.json') != ''
        with:
          name: auditoria-equilibrio-primera
          path: balance-report.json
