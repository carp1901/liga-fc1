name: Balance audit - Primera Nacional y Primera
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test-balance.js'
      - 'test-promotion-balance.js'
      - 'test-national-career-balance.js'
      - '.github/workflows/balance.yml'
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.js'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - 'public/engine.js'
      - 'public/data.js'
      - 'public/squads.js'
      - 'test-balance.js'
      - 'test-promotion-balance.js'
      - 'test-national-career-balance.js'
      - '.github/workflows/balance.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar ascensos y descensos
        run: node test-promotion-balance.js | tee promotion-report.json
      - name: Simular 60 temporadas de Primera
        run: node test-balance.js | tee balance-report.json
      - name: Simular 60 temporadas de carrera desde Primera Nacional
        run: node test-national-career-balance.js | tee national-career-report.json
      - name: Publicar resumen
        if: always()
        run: |
          echo '## Auditoría de equilibrio de Primera y Primera Nacional' >> "$GITHUB_STEP_SUMMARY"
          for f in balance-report.json promotion-report.json national-career-report.json; do
            if [ -s "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Guardar informes de auditoría
        if: success() && github.event_name == 'push'
        run: |
          mkdir -p planteles
          cp balance-report.json planteles/auditoria-equilibrio-primera.json
          cp promotion-report.json planteles/auditoria-ajustes-ascensos-descensos.json
          cp national-career-report.json planteles/auditoria-trayectoria-primera-nacional.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planteles/auditoria-equilibrio-primera.json planteles/auditoria-ajustes-ascensos-descensos.json planteles/auditoria-trayectoria-primera-nacional.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record multi-season Primera Nacional career audit'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('balance-report.json') != ''
        with:
          name: auditoria-equilibrio-primera-nacional
          path: |
            balance-report.json
            promotion-report.json
            national-career-report.json
