<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liga FC · Técnicos online</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bd:#12281c;--pz:#1b3a29;--pz2:#244a35;--tz:#f2efe3;--mu:#9db3a4;--ce:#75aadb;--so:#f2b705;--ro:#e0584f;--ln:#ffffff26}
*{box-sizing:border-box}body{margin:0;background:var(--bd);color:var(--tz);font:14px Barlow,system-ui,sans-serif}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.2px}h1{font-size:44px;margin:0}h2{font-size:20px;margin:0 0 8px}
main{max-width:1000px;margin:auto;padding:12px}.box{background:var(--pz);border:1px solid var(--ln);border-radius:6px;padding:10px;margin-bottom:8px}
button,select,input{font:inherit;color:var(--tz);background:var(--pz2);border:1px solid var(--ln);border-radius:5px;padding:7px 10px}button{cursor:pointer}
button.on{background:var(--ce);color:#08160e;border-color:var(--ce)}button.go{background:var(--so);color:#1c1500;border-color:var(--so);font-weight:600}button:disabled{opacity:.45}
input[type=color]{padding:0;width:38px;height:30px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.tm{display:flex;gap:8px;align-items:center;text-align:left;padding:8px}.tm.occ{background:#0b1710;color:var(--mu);cursor:default}.tm small{display:block}
.cw{position:relative;display:inline-block;flex:none}.cr,.cw img{position:absolute;inset:0;width:100%;height:100%}.cw img{object-fit:contain}.cr{clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);display:grid;place-items:center;font:700 11px "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 0 3px #000}
.two{display:grid;grid-template-columns:3fr 2fr;gap:10px}@media(max-width:760px){.two{grid-template-columns:1fr}h1{font-size:34px}}
canvas{width:100%;display:block;border-radius:6px;background:#2d7a46}table{width:100%;border-collapse:collapse}td,th{padding:3px 4px;text-align:center}td:nth-child(2),th:nth-child(2){text-align:left}th{color:var(--mu);font-weight:500}tr.me{color:var(--so);font-weight:600}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}
#chl{height:120px;overflow:auto;background:#0e1f15;border-radius:5px;padding:6px}.msg{padding:3px 0;border-bottom:1px solid var(--ln);display:flex;gap:6px;align-items:center}.msg b{color:var(--ce)}
.m1{display:flex;justify-content:space-between;gap:6px;padding:3px 0}.m1.me{color:var(--so)}[hidden]{display:none!important}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 10px;margin-top:8px}.tg label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:2px}.tg select{font-size:13px;padding:3px 4px;width:100%}.tg input[type=color]{width:34px;height:24px}summary{cursor:pointer;font-size:15px}
.sup{margin-top:6px;border-top:1px solid var(--ln);padding-top:4px}.pr{display:flex;gap:6px;padding:2px 6px;font-size:13px;cursor:pointer;border-radius:4px}.pr:hover{background:var(--pz2)}.pr i{font-style:normal;color:var(--mu);width:32px;font-size:11px}.pr b{margin-left:auto;font-weight:600}.pr.sel{outline:2px solid var(--so)}
.vt{display:flex;gap:5px;margin-left:auto}.vb{display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.1}.vb button{padding:0 6px;font-size:13px;line-height:1.5}button.up{background:#2fb36a44;border-color:#2fb36a}button.dn{background:#e0584f44;border-color:#e0584f}button.up.on{background:#2fb36a;color:#fff}button.dn.on{background:#e0584f;color:#fff}.mt{flex:1;min-width:0;word-break:break-word}#cal{max-height:240px;overflow:auto}
.tbl td,.tbl th{padding:3px 3px;font-size:12.5px}.tbl td.pt{font-weight:700;color:var(--so);font-size:14px}.tbl th:last-child{color:var(--so)}
.sr{display:grid;grid-template-columns:1fr 92px 1fr;gap:6px;text-align:center;font-size:13px;padding:1px 0}.sr b:first-child{text-align:right}.sr b:last-child{text-align:left}.sr span{color:var(--mu)}
.sw{display:flex;align-items:center;gap:4px;font-size:13px}.info{font-size:12.5px;background:var(--pz2);border-radius:5px;padding:6px 8px;margin:4px 0}
.rt{min-width:30px;text-align:right}.pr b.rt{margin-left:6px}.rt.g{color:#3ddc84}.rt.r{color:#ff6b61}.pr.rj{opacity:.4;text-decoration:line-through}
.m1{padding:3px 6px;border-radius:4px}.m1.rw{background:#2fb36a40}.m1.rd{background:#f2b70540}.m1.rl{background:#e0584f40}
.pr.pPOR{background:#f5c51822}.pr.pDEF{background:#4aa3df22}.pr.pMED{background:#3fbf6e22}.pr.pDEL{background:#e0584f22}.pr.sel{outline:2px solid var(--so)}
.pr i.ch{font-style:normal;font-weight:700;width:34px;font-size:11px;letter-spacing:.3px}.ch.cPOR{color:#f5c518}.ch.cDEF{color:#6cb8ee}.ch.cMED{color:#4fd28a}.ch.cDEL{color:#ff7d74}.ch.cSUP{color:var(--mu)}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;border-radius:6px;overflow:hidden;margin-bottom:5px;min-height:46px}.sbt{padding:5px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}.sbt:last-child{text-align:right}
.sbt b{font:700 18px "Barlow Condensed",sans-serif;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbt small{color:inherit;opacity:.92;font-size:11px;margin:0;min-height:13px}
.sbs{background:#0b1710;padding:2px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:112px}.sbs span{font:700 34px "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 0 14px #f2b705aa;line-height:1}.sbs small{color:var(--so);margin:0;font-size:12px}
#ov{position:absolute;inset:10% 18%;display:grid;place-items:center;pointer-events:none}.gl{background:#08140df0;border:2px solid var(--so);border-radius:12px;padding:12px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 0 40px #000a}
.gt{font:700 56px "Barlow Condensed",sans-serif;color:var(--so);line-height:1}.gn{font:600 17px Barlow,sans-serif}.gs{font-size:15px;color:var(--mu)}@media(max-width:760px){.gt{font-size:38px}}
</style></head><body><main>
<div id="menu"><h1>Liga FC</h1><p class="mu">Técnicos online. Armá tu liga con amigos, elegí equipo y definí la táctica. Sin registro.</p>
<div class="box"><div class="row"><input id="nm" placeholder="Tu nombre" maxlength="16"><input id="cd" placeholder="Código de sala" maxlength="12"></div>
<div class="row"><button class="go" id="bj">Unirme a la sala</button><button id="bc">Crear sala nueva</button><button id="bo">Jugar offline vs IA</button></div><div id="off" hidden><div class="row"><select id="odv"></select><select id="ofm"><option value="liga1">Todos contra todos (1 rueda)</option><option value="liga2">Todos contra todos (2 ruedas)</option><option value="copa">Mata-mata</option></select><select id="onp"><option value="4">4 equipos</option><option value="6" selected>6 equipos</option><option value="8">8 equipos</option><option value="12">12 equipos</option><option value="16">16 equipos</option><option value="20">20 equipos</option></select><select id="osp"><option value="1">Velocidad normal</option><option value="2">Rápida (x2)</option><option value="5">Muy rápida (x5)</option></select><button class="go" id="bo2">Empezar</button></div><small class="mu">Vos contra equipos manejados por la IA. No necesita servidor ni internet.</small></div>
<div id="cfg" hidden><div class="row"><select id="ct"></select><select id="dv"></select><select id="fm"><option value="liga1">Todos contra todos (1 rueda)</option><option value="liga2">Todos contra todos (2 ruedas)</option><option value="copa">Mata-mata</option></select><select id="np"></select></div>
<div class="row"><button class="go" id="bc2">Crear y entrar</button></div><small class="mu">Grupos + play-off: próximamente.</small></div><p id="er" style="color:var(--ro)"></p></div></div>
<div id="gm" hidden><div class="box" id="hd"></div><div class="box" id="fr"><h2 style="margin-bottom:4px">Foro</h2><div id="chl"></div><div class="row"><input id="ci" placeholder="Escribí un mensaje…" maxlength="140" style="flex:1"><button id="cs">Enviar</button></div></div><div class="box" id="cal" hidden></div><div id="pk" class="box" hidden></div>
<div id="pl" hidden><div class="two"><div><div class="box" style="padding:6px"><div id="sb"></div><div style="position:relative"><canvas id="cv" width="720" height="440"></canvas><div id="ov" hidden></div></div></div><div class="box" id="sts"></div><div class="box" id="inf"></div></div><div><div class="box" id="tb"></div></div></div>
<div class="box" id="tc"></div></div>
</div>
</main><script src="squads.js"></script><script src="data.js"></script><script src="engine.js"></script><script src="sim2d.js"></script><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DV=[],TM={},S=null,room,sel=null,evAt=0,evKey='',OFF=false,CAL=[],showCal=false,SPD=1,showInfo=false,tcOpen=true;const FM=[[4,4,2],[4,3,3],[3,5,2],[4,5,1],[5,3,2]],FN=FM.map(f=>f.join('-'));
let pid;try{pid=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2)+Date.now().toString(36))}catch(e){pid=Math.random().toString(36).slice(2)}
try{$('#nm').value=localStorage.nm||''}catch(e){}
const cache={},set=(id,h)=>{if(cache[id]!==h){cache[id]=h;$(id).innerHTML=h}};
const cr=(id,s=30)=>{const t=TM[id];return`<span class=cw style="width:${s}px;height:${Math.round(s*1.1)}px"><span class=cr style="background:linear-gradient(135deg,${t.c1} 50%,${t.c2} 50%)">${esc(t.name.replace(/[^A-Za-zÁÉÍÓÚ ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,3))}</span><img src="/crests/${id}.png" alt="" onload="this.previousSibling.remove()" onerror="this.remove()"></span>`};
const rc=q=>{if(!q.s)return'';const m=q.s.match(/^(\d+)-(\d+)/);if(!m)return'';const a=+m[1],b=+m[2];if(a!=b)return a>b?'rw':'rl';return/ganó/.test(q.s)?'rw':/perdió/.test(q.s)?'rl':'rd'};
const LB={POR:'ARQ',DEF:'DEF',MED:'MED',DEL:'DEL'};
const mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0'),sur=n=>n.split('. ')[1]||n;
(d=>{DV=d;d.forEach(v=>v.teams.forEach(t=>TM[t.id]=t));
 $('#ct').innerHTML=[...new Set(d.map(v=>v.country))].map(c=>`<option>${c}</option>`).join('');
 $('#dv').innerHTML=d.map(v=>`<option value="${v.id}" ${v.ok?'':'disabled'}>${v.name}${v.ok?'':' (próximamente)'}</option>`).join('');
 $('#odv').innerHTML=$('#dv').innerHTML;
 $('#np').innerHTML=[4,6,8,12,16,20].map(n=>`<option value="${n}">${n} jugadores</option>`).join('')})(DATA.DIVS);
async function post(b){const m={pid,room,name:$('#nm').value.trim(),...b};if(OFF)return ENG.act(m);try{const r=await fetch('/act',{method:'POST',body:JSON.stringify(m)});return(await r.json()).error}catch(e){return'No hay servidor. Para jugar online abrí el link del servidor; para probar usá el modo offline.'}}
async function enter(a){room=$('#cd').value.trim().toLowerCase();try{localStorage.nm=$('#nm').value}catch(e){}
 if(!$('#nm').value.trim())return $('#er').textContent='Poné tu nombre';const cfg={div:$('#dv').value,fmt:$('#fm').value,n:+$('#np').value};
 const e=await post({a,cfg});if(e)return $('#er').textContent=e;start()}
function start(){$('#menu').hidden=true;$('#gm').hidden=false;if(OFF)ENG.listen(room,pid,v=>{S=v;render()});else{const es=new EventSource(`/ev?room=${room}&pid=${pid}`);es.onmessage=m=>{S=JSON.parse(m.data);render()}}}
async function offline(){OFF=true;SPD=+$('#osp').value||1;room='cpu'+Math.random().toString(36).slice(2,7);if(!$('#nm').value.trim())$('#nm').value='DT';const e=await post({a:'create',off:1,speed:+$('#osp').value,cfg:{div:$('#odv').value,fmt:$('#ofm').value,n:+$('#onp').value}});if(e){OFF=false;return $('#er').textContent=e}start()}
$('#bj').onclick=()=>enter('join');$('#bc').onclick=()=>$('#cfg').hidden=false;$('#bc2').onclick=()=>enter('create');$('#bo').onclick=()=>$('#off').hidden=false;$('#bo2').onclick=offline;
const ownM=()=>S&&S.me&&S.me.team&&S.ms.find(m=>m.a==S.me.team||m.b==S.me.team);
function render(){const v=S,me=v.me||{},ph=v.phase,n=v.cfg.n;let st='';
 const nr=v.ready.filter(x=>x).length;if(v.cal)CAL=v.cal;
 const nx=me.team&&v.next?`<div class=row>${v.next.o?`Próximo: ${cr(me.team,18)} ${esc(TM[me.team].name)} vs ${cr(v.next.o,18)} ${esc(TM[v.next.o].name)} <span class=mu>(${v.next.h?'local':'visitante'})</span>`:'Próxima fecha: descansás (pasás directo)'} <button data-cal=1>📅 Calendario</button></div>`:'';
 const pkx=ph=='pick'?`<div class=row style="gap:4px 14px">${v.pls.map(p=>`<span>${p.t?cr(p.t,16):'⏳'} ${esc(p.n)} <span class=mu>${p.t?'✔ eligió':'eligiendo…'}</span></span>`).join('')}${Array(Math.max(0,n-v.pls.length)).fill('<span class=mu>⏳ esperando jugador…</span>').join('')}</div><small class=mu>La pretemporada empieza sola cuando todos elijan su equipo.</small>`:'';
 if(ph=='pick')st=`Elegí tu equipo · ${v.n}/${n} en sala`;else if(ph=='pre')st=`Pretemporada ${mmss(v.t)} · listos ${nr}/${n}`;else if(ph=='cer')st='¡Salen los equipos a la cancha!';else if(ph=='m1')st=`1er tiempo ${v.min}'`;else if(ph=='ht')st=`Entretiempo ${v.t}s · hacé tus cambios`;else if(ph=='m2')st=`2do tiempo ${v.min}'`;
 else if(ph=='lobby')st=`Fecha ${v.round} terminada · listos ${nr}/${n}`;else st=v.champ?`🏆 Campeón: ${TM[v.champ].name}`:'Torneo terminado';
 set('#hd',`<div class=row><h2 style="margin:0">${v.off?'Modo offline vs IA':'Sala '+esc(v.code)}</h2><span class=mu>${v.cfg.fmt=='copa'?'Mata-mata':v.cfg.fmt=='liga2'?'2 ruedas':'1 rueda'} · ${n} jugadores${v.total&&v.cfg.fmt!='copa'?` · fecha ${Math.min(v.round+(['cer','m1','ht','m2'].includes(ph)?1:0),v.total)}/${v.total}`:''}</span><button onclick="location.reload()" style="margin-left:auto">Salir</button></div><h2 style="color:var(--so);margin:6px 0 0">${st}</h2>`+nx+pkx+(['pre','lobby'].includes(ph)&&me.team?`<div class=row><button class="${me.ready?'on':'go'}" data-r="${me.ready?0:1}">${me.ready?'✔ Listo (tocá para cancelar)':'Estoy listo'}</button></div>`:''));
 $('#cal').hidden=!showCal||!me.team;if(showCal&&me.team)set('#cal',`<h2>Calendario · ${esc(TM[me.team].name)}</h2>${CAL.length?CAL.map(q=>`<div class="m1 ${rc(q)}"><span>Fecha ${q.r}</span><span>${q.h?'vs':'@'} ${cr(q.o,16)} ${esc(TM[q.o].name)}</span><b>${q.s||'—'}</b></div>`).join(''):'<span class=mu>Todavía no hay fixture.</span>'}`);
 $('#pk').hidden=ph!='pick';$('#pl').hidden=ph=='pick';
 if(ph=='pick'){const d=DV.find(x=>x.id==v.cfg.div);set('#pk',`<div class=grid>${d.teams.map(t=>{const o=v.own[t.id];return o?`<button class="tm occ" disabled>${cr(t.id)}<span>${esc(t.name)}<small>${esc(o)}</small></span></button>`:`<button class=tm data-p="${t.id}">${cr(t.id)}<span>${esc(t.name)}</span></button>`}).join('')}</div>`)}
 else{const tb={};v.table.forEach(q=>tb[q.id]={...q});
  if(v.cfg.fmt!='copa')v.ms.forEach(m=>{const A=tb[m.a],B=tb[m.b];A.pj++;B.pj++;A.gf+=m.ga;A.ga+=m.gb;B.gf+=m.gb;B.ga+=m.ga;if(m.ga>m.gb){A.pts+=3;A.g++;B.p++}else if(m.ga<m.gb){B.pts+=3;B.g++;A.p++}else{A.pts++;B.pts++;A.e++;B.e++}});
  const rows=Object.values(tb).sort((a,b)=>b.pts-a.pts||b.g-a.g||b.gf-a.gf||(b.gf-b.ga)-(a.gf-a.ga));
  set('#tb',v.cfg.fmt=='copa'?`<h2>Llave</h2>${(v.res||[]).map(x=>`<div class=m1><span>${cr(x.a,18)} ${TM[x.a].name}</span><b>${x.ga}-${x.gb}${x.pen?' ('+TM[x.pen].name+' pen.)':''}</b><span>${TM[x.b].name} ${cr(x.b,18)}</span></div>`).join('')||'<span class=mu>Todavía no se jugó la primera ronda.</span>'}`
  :`<h2>Tabla en vivo</h2><table class=tbl><tr><th>#</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>Pts</th></tr>${rows.map((q,i)=>`<tr class="${q.id==me.team?'me':''}"><td>${i+1}</td><td>${cr(q.id,16)} ${esc(TM[q.id].name)} <span class=mu>(${esc(v.own[q.id]||'')})</span></td><td>${q.pj}</td><td>${q.g}</td><td>${q.e}</td><td>${q.p}</td><td>${q.gf}</td><td>${q.ga}</td><td class=pt>${q.pts}</td></tr>`).join('')}</table>`);
  set('#inf',`<h2>Partidos</h2>${v.ms.length?v.ms.map(m=>`<div class="m1 ${m.a==me.team||m.b==me.team?'me':''}"><span>${cr(m.a,18)} ${esc(TM[m.a].name)}</span><b class=num>${m.ga} - ${m.gb}</b><span>${esc(TM[m.b].name)} ${cr(m.b,18)}</span></div>`).join(''):'<span class=mu>Sin partidos en juego. Cambiá tu táctica y poné listo.</span>'}${v.byes&&v.byes.length&&v.ms.length?`<small class=mu>Pasan directo: ${v.byes.map(b=>TM[b].name).join(', ')}</small>`:''}`);
  {const om=ownM();set('#sts',om?(()=>{const h=om.a==me.team,sa=om.st[h?0:1],sb=om.st[h?1:0],tot=(sa[0]+sb[0])||1,pa=Math.round(sa[0]/tot*100),row=(l,x,y)=>`<div class=sr><b>${x}</b><span>${l}</span><b>${y}</b></div>`;
   return row('Estadísticas',esc(TM[me.team].name),esc(TM[h?om.b:om.a].name))+row('Posesión',pa+'%',(100-pa)+'%')+row('Remates',sa[1],sb[1])+row('A puerta',sa[2],sb[2])+row('Córners',sa[3],sb[3])+row('Faltas',sa[4],sb[4])+row('Tarjetas',`🟨${sa[5]} 🟥${sa[6]}`,`🟨${sb[5]} 🟥${sb[6]}`)})():'<span class=mu>Las estadísticas del partido aparecen acá cuando empieza.</span>')}
  if(me.tac&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#tc'))){const t=me.tac,sq=me.sq,inx=new Set(t.xi),
   sl=(k,a)=>`<select data-k="${k}">${a.map((x,i)=>`<option value="${i}" ${t[k]==i?'selected':''}>${x}</option>`).join('')}</select>`,
   op=k=>`<select data-k="${k}">${t.xi.map(i=>`<option value="${i}" ${t[k]==i?'selected':''}>${esc(sq[i].n)}</option>`).join('')}</select>`,
   rt=i=>{const r=me.rt&&me.rt[i];return r==null?'':`<b class="rt ${r>=7?'g':r<6?'r':''}">${r.toFixed(1).replace('.',',')}</b>`},
   cd=i=>me.cd?(me.cd[i][0]?' 🟨':'')+(me.cd[i][1]?' 🟥':''):'',
   row=(x,i,s)=>`<div class="pr p${x.p} ${sel===i?'sel':''} ${me.cd&&me.cd[i][1]?'rj':''}" data-s="${i}"><i class="ch c${s}">${LB[s]||s}</i>${esc(x.n)}${cd(i)}<span class=mu style="margin-left:auto">${x.r}</span>${rt(i)}</div>`;
   set('#tc',`<details id=dt ${tcOpen?'open':''}><summary><b>Táctica · ${esc(TM[me.team].name)}</b></summary><div class=row style="margin-top:8px"><button class=go data-fill=1>Formar automático</button><label class=sw><input type=checkbox data-k="auto" ${t.auto?'checked':''}> Cambios automáticos</label><button data-info=1 title="Info">ⓘ</button></div>${showInfo?'<div class=info>Los cambios se hacen solos a partir del minuto 60. Sale un jugador si está rindiendo por debajo de lo esperado (puntaje menor a 5,7) o si tiene amarilla, y entra el mejor suplente de su misma posición. Máximo 3 cambios por partido.</div>':''}<div class=tg><label>Formación${sl('f',FN)}</label><label>Estilo${sl('st',['Defensivo','Equilibrado','Ofensivo'])}</label><label>Presión${sl('pr',['Baja','Alta'])}</label><label>Ataque${sl('wing',['Por el medio','Por las bandas'])}</label><label>Capitán${op('cap')}</label><label>Pelota parada${op('pk')}</label><label>Camiseta<span><input type=color data-k="k1" value="${t.k1}"> <input type=color data-k="k2" value="${t.k2}"></span></label></div><div class=mu style="font-size:12px;margin:6px 0 2px">Tocá un titular y luego un suplente para cambiarlo (también con el partido en juego).${me.rt?' Puntaje: 6,0 es promedio, <span class="rt g">7,0</span> es buena, <span class="rt r">5,8</span> o menos es floja.':''}</div><div class=pl>${t.xi.map((i,k)=>row(sq[i],i,me.sl[k])).join('')}</div><div class="pl sup">${sq.map((x,i)=>inx.has(i)?'':row(x,i,'SUP')).join('')}</div></details>`)}}

const cv=$('#cv'),cx=cv.getContext('2d'),Q=SIM2D,W=Q.W,H=Q.H,SIM=new Q.Sim();

const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255},ink=(a,b)=>Math.abs(lum(a)-lum(b))<.3?(lum(a)>.5?'#111':'#fff'):b,c01=x=>Math.max(0,Math.min(1,x));

function ceremony(t,mine,opp,names){const dur=5000/(OFF?SPD:1),p=c01((t-cerT0)/dur),N=25,lx=j=>Q.X0+24+j*(Q.FW-48)/(N-1),ly=H/2+26,ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 for(let j=0;j<N;j++){const q=ease(c01((p-Math.abs(j-12)*.015)/.45)),sx=W/2+(j-12)*7,sy=H+28,x=sx+(lx(j)-sx)*q,y=sy+(ly-sy)*q+(q<1?Math.sin(p*40+j)*2:0);
  if(j>=11&&j<=13)disc(x,y,'#111','#f2b705',3);else{const T=j<11?mine:opp,gk=j==0||j==24;disc(x,y,gk?'#39424b':T.k[0],gk?T.k[0]:T.k[1],3)}}
 if(p>.45){cx.font='700 28px "Barlow Condensed",sans-serif';cx.textAlign='center';cx.fillStyle='#000a';cx.fillText(names[0],W*.27+2,ly-62);cx.fillText(names[1],W*.73+2,ly-62);cx.fillStyle='#fff';cx.fillText(names[0],W*.27,ly-64);cx.fillText(names[1],W*.73,ly-64)}}
function frame(){requestAnimationFrame(frame);if(!S||!S.me||!S.me.team||S.phase=='pick')return;
 const m=ownM(),t=performance.now(),own=S.me.team,ph=S.phase,home=!m||m.a==own,
  mine={f:m?(home?m.fa:m.fb):S.me.tac.f,k:m?(home?m.ka:m.kb):[S.me.tac.k1,S.me.tac.k2]},opp=m?{f:home?m.fb:m.fa,k:home?m.kb:m.ka}:null,oppId=m?(home?m.b:m.a):null;
 const re=SIM.setup(mine.f,opp?opp.f:null,m?m.a+m.b+S.round:'x'+S.round);
 if(ph!==lastPh){lastPh=ph;if(ph=='m1'||ph=='m2'){SIM.frozen=false;SIM.kickoff(ph=='m2'?1:0)}else{SIM.frozen=true;SIM.hardRest();if(ph=='cer'){cerT0=t;SH=[0,0]}}}
 else if(re&&!SIM.frozen)SIM.kickoff(0);
 if(m){SIM.setTac(0,home?m.ta:m.tb);SIM.setTac(1,home?m.tb:m.ta);SIM.setOff(0,home?m.oa:m.ob);SIM.setOff(1,home?m.ob:m.oa)}else SIM.setTac(0,[S.me.tac.st,S.me.tac.pr,S.me.tac.wing]);
 if(m&&m.fl&&flId!==m.fl.id){flId=m.fl.id;if(m.fl.x!='f'){flAt=t;const f=m.fl;flMsg=(FLT[f.x]||'')+(f.x=='sub'?f.n:(f.n.split('. ')[1]||f.n))}}
 for(let i=0,n=Math.min(5,Math.max(1,Math.round(SPD)));i<n;i++)SIM.step();
 if(m){const so=home?m.ga:m.gb,sr=home?m.gb:m.ga;if(!SIM.sc&&!SIM.q.length){if(++idleF>100&&(SH[0]!==so||SH[1]!==sr))SH=[so,sr]}else idleF=0}
 cx.fillStyle='#2d7a46';cx.fillRect(0,0,W,H);for(let i=0;i<10;i++){if(i%2){cx.fillStyle='#ffffff10';cx.fillRect(20+i*(W-40)/10,20,(W-40)/10,H-40)}}
 cx.strokeStyle='#ffffffaa';cx.lineWidth=2;cx.strokeRect(20,20,W-40,H-40);cx.beginPath();cx.moveTo(W/2,20);cx.lineTo(W/2,H-20);cx.stroke();cx.beginPath();cx.arc(W/2,H/2,50,0,7);cx.stroke();cx.strokeRect(20,H/2-70,80,140);cx.strokeRect(W-100,H/2-70,80,140);
 cx.fillStyle='#ffffff30';cx.fillRect(Q.X0-16,Q.GY0,16,Q.GY1-Q.GY0);cx.fillRect(Q.X0+Q.FW,Q.GY0,16,Q.GY1-Q.GY0);
 const B=SIM.B,sc=SIM.sc;
 if(ph=='cer'&&m)ceremony(t,mine,opp,[TM[own].name,TM[oppId].name]);
 else{cx.lineCap='round';SIM.tr.forEach(l=>{const a=1-(SIM.n-l.n)/40;if(a>0){cx.strokeStyle=`rgba(255,255,255,${a*.85})`;cx.lineWidth=2;cx.beginPath();cx.moveTo(l.x0,l.y0);cx.lineTo(l.x1,l.y1);cx.stroke()}});
  SIM.P.forEach(p=>{if(p.off)return;const T=p.s?opp:mine,gk=p.k==0;disc(p.x,p.y,gk?'#39424b':T.k[0],gk?T.k[0]:T.k[1],3);
   if(p.s==0&&S.me.sq){cx.fillStyle='#fff';cx.font='12px Barlow,sans-serif';cx.textAlign='center';cx.fillText(sur(S.me.sq[S.me.tac.xi[p.k]].n),p.x,p.y+25)}});
  if(sc&&sc.k!='att')disc(B.x+16,B.y-16,'#f2b705','#111',2,8);

  disc(B.x,B.y,'#fff','#000',1,Q.BR);
  if(sc&&sc.label&&['f','set','wait','run'].includes(sc.ph)){cx.font='700 30px "Barlow Condensed",sans-serif';cx.textAlign='center';cx.fillStyle='#000a';cx.fillText(sc.label,W/2+2,H-14);cx.fillStyle='#f2b705';cx.fillText(sc.label,W/2,H-16)}}
 if(m&&flMsg&&t<flAt+2400){cx.font='600 15px Barlow,sans-serif';cx.textAlign='center';const w=cx.measureText(flMsg).width+24;cx.fillStyle='#000b';cx.fillRect(W/2-w/2,8,w,26);cx.fillStyle='#fff';cx.fillText(flMsg,W/2,26)}
 if(ph=='end'){const msg=S.champ?'🏆 '+TM[S.champ].name:'Fin';cx.font='700 34px "Barlow Condensed",sans-serif';cx.textAlign='center';cx.fillStyle='#000a';cx.fillText(msg,W/2+2,H/2-58);cx.fillStyle='#f2b705';cx.fillText(msg,W/2,H/2-60)}

  set('#sb',`<div class=sbar><div class=sbt style="background:${k1[0]};color:${ink(k1[0],k1[1])}"><b>${esc(TM[own].name)}</b><small>${esc(ow(0))}</small></div><div class=sbs><span>${SH[0]} - ${SH[1]}</span><small>${tm}</small></div><div class=sbt style="background:${k2[0]};color:${ink(k2[0],k2[1])}"><b>${esc(TM[oppId].name)}</b><small>${esc(ow(1))}</small></div></div>`)}else set('#sb','');
